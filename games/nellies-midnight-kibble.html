<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>Nellie's Midnight Kibble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: the third cabinet in the arcade, midnight blue. Marquee (the show's own art), CRT screen, joystick and a D-pad. */
:root{
  --room:#070B1C; --room-2:#0F1A3D; --cab:#123A5C; --cab-deep:#081B33; --tmold:#F5C518; --bezel:#04060D;
  --cream:#FFF1BF; --ink:#CFE0F5; --muted:#8FA6C6; --blue:#2F5BEA; --red:#E8453C;
  --pixel:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--room);color:var(--ink);font-family:var(--pixel);-webkit-font-smoothing:none;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(245,197,24,.07) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(47,91,234,.10) 0 3px, transparent 4px),
    radial-gradient(circle at 40% 80%, rgba(232,69,60,.06) 0 2px, transparent 3px),
    radial-gradient(ellipse at 50% 0%, var(--room-2), var(--room) 70%);
  background-size:46px 46px, 62px 62px, 38px 38px, 100% 100%;}
.room{min-height:100%;display:grid;place-items:center;gap:14px;padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.cabinet{container-type:inline-size;width:min(100%, 760px, max(300px, calc((85vh - 332px) * 4 / 3 + 52px)));
  background:linear-gradient(180deg, var(--cab), var(--cab-deep));border-radius:22px 22px 14px 14px;
  box-shadow:0 0 0 4px var(--tmold), 0 30px 80px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12);
  padding:14px 14px 16px;display:grid;gap:12px}
@supports (height:100dvh){.cabinet{width:min(100%, 760px, max(300px, calc((85dvh - 332px) * 4 / 3 + 52px)))}}
.marquee{border-radius:12px;overflow:hidden;background:#FFEFD8;box-shadow:0 0 28px rgba(255,226,140,.55), inset 0 0 0 2px rgba(0,0,0,.25);position:relative}
.marquee img{display:block;width:100%;height:clamp(64px, 15vh, 170px);max-width:100%;object-fit:contain}
.marquee::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.25), transparent 35%, transparent 70%, rgba(0,0,0,.12));pointer-events:none}
.bezel{background:var(--bezel);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 2px #17233d, inset 0 8px 24px rgba(0,0,0,.8)}
.screen{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:#000;outline:none;touch-action:none;cursor:pointer}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#dog{filter:url(#dogview);display:none}
#gl{image-rendering:auto;display:none}#hud{display:none}
.minis{display:flex;gap:8px}
.crt{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.55);border-radius:12px;animation:flick 4s infinite steps(1)}
.crt::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg, rgba(255,255,255,.07), transparent 40%);border-radius:12px}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.94}}
.screen:focus-visible{box-shadow:0 0 0 3px var(--tmold)}
.panel{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(180deg, #1f5585, #0e2a4d);border-radius:12px;padding:12px 18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12), inset 0 -6px 12px rgba(0,0,0,.35)}
.stick{width:var(--st, 64px);height:var(--st, 64px);border-radius:50%;background:radial-gradient(circle at 50% 50%, #0b0f22 0 40%, #1b2654 41% 60%, #0b0f22 61%);position:relative;flex:none}
.stick i{position:absolute;left:50%;top:50%;width:calc(var(--st, 64px) * 10 / 64);height:calc(var(--st, 64px) * 34 / 64);margin:calc(var(--st, 64px) * -30 / 64) 0 0 calc(var(--st, 64px) * -5 / 64);background:linear-gradient(90deg,#9aa3c4,#e6e9f5,#8a93b5);border-radius:calc(var(--st, 64px) * 5 / 64);transform-origin:50% 88%;transition:transform .06s}
.stick i::before{content:"";position:absolute;left:50%;top:calc(var(--st, 64px) * -14 / 64);width:calc(var(--st, 64px) * 28 / 64);height:calc(var(--st, 64px) * 28 / 64);margin-left:calc(var(--st, 64px) * -14 / 64);border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffe680, var(--tmold) 55%, #8a6a05)}
.stick.l i{transform:rotate(-22deg)}.stick.r i{transform:rotate(22deg)}.stick.u i{transform:scaleY(1.1) translateY(-3px)}.stick.d i{transform:scaleY(.82) translateY(4px)}
/* ---------- the pullable arcade joystick (shared by the Nellie arcade games, with joystick.js) ----------
   Each game draws its own .stick (socket, shaft, ball) sized by --st (64px on a desktop, as before). */
.joy{display:flex;flex:none;flex-direction:column;align-items:center;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab;outline:none;border-radius:14px}
.joy:focus-visible{box-shadow:0 0 0 3px var(--tmold)}
.joy.drag{cursor:grabbing}
.joy.drag .stick i{transition:none}
.joy.spring .stick i{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.joy-label{display:none;align-items:center;gap:7px;font-family:var(--pixel);font-size:8px;line-height:1;color:var(--cream);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
.joy-label b{display:block;width:0;height:0;border:5px solid transparent}
.joy-label b.l{border-left:0;border-right:7px solid var(--tmold)}
.joy-label b.r{border-right:0;border-left:7px solid var(--tmold)}
.joy-label b.u{border-top:0;border-bottom:7px solid var(--tmold)}
.joy-label b.d{border-bottom:0;border-top:7px solid var(--tmold)}
.joy-label .four{display:grid;grid-template-columns:repeat(3,8px);grid-template-rows:repeat(3,8px);place-items:center}
.joy-label .four b{border-width:4px}.joy-label .four b.l{border-right-width:6px}.joy-label .four b.r{border-left-width:6px}.joy-label .four b.u{border-bottom-width:6px}.joy-label .four b.d{border-top-width:6px}
.joy-label .four .u{grid-area:1/2}.joy-label .four .l{grid-area:2/1}.joy-label .four .r{grid-area:2/3}.joy-label .four .d{grid-area:3/2}
/* touch screens: the joystick is the control: bigger, labelled, and it wiggles on its own until the first touch.
   No long-press text selection or callout anywhere on the cabinet (iOS), so a held finger never turns into a selection. */
.cabinet.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cabinet.touch .joy{gap:8px;padding:calc(var(--st) * .2 + 2px) 10px 2px}
.cabinet.touch .joy-label{display:flex}
.cabinet.touch .joy.hint .stick i{animation:joywig 2.6s ease-in-out infinite}
.cabinet.touch .joy.hint.four .stick i{animation:joywig4 4s ease-in-out infinite}
@keyframes joywig{0%,8%{transform:rotate(0)}22%,30%{transform:rotate(-24deg)}44%,56%{transform:rotate(0)}70%,78%{transform:rotate(24deg)}92%,100%{transform:rotate(0)}}
@keyframes joywig4{0%,4%{transform:none}13%,18%{transform:rotate(-24deg)}27%,29%{transform:none}38%,43%{transform:rotate(24deg)}52%,54%{transform:none}63%,68%{transform:translateY(-3px) scaleY(1.12)}77%,79%{transform:none}88%,93%{transform:translateY(4px) scaleY(.82)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.cabinet.touch .joy.hint .stick i{animation-duration:5s}.cabinet.touch .joy.hint.four .stick i{animation-duration:7s}.joy.spring .stick i{transition-duration:.15s;transition-timing-function:ease-out}}

.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:2px}
.dpad button{border:0;border-radius:10px;background:linear-gradient(180deg,#3a6fe0,#2348b8);box-shadow:0 4px 0 #13306f;display:grid;place-items:center}
.dpad button:active,.dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #13306f}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.tri{width:0;height:0}
.tri.l{border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:12px solid var(--cream)}
.tri.r{border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:12px solid var(--cream)}
.tri.u{border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--cream)}
.tri.d{border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--cream)}
.right{display:flex;gap:12px;align-items:center}
button{font-family:var(--pixel);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--tmold);outline-offset:3px}
.dpad button{touch-action:none}
.arc{width:70px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;font-size:10px;color:#3a2c00;
  background:radial-gradient(circle at 38% 30%, #ffe680, var(--tmold) 55%, #a8820a);box-shadow:0 5px 0 #6e5506, 0 8px 14px rgba(0,0,0,.45)}
.arc:active{transform:translateY(4px);box-shadow:0 1px 0 #6e5506}
.mini{background:transparent;border:2px solid var(--muted);color:var(--ink);font-size:8px;padding:8px 10px;border-radius:8px;line-height:1.4}
.mini[aria-pressed="false"]{color:var(--muted)}
.help{margin:0;text-align:center;font-size:8px;line-height:2;color:var(--muted);letter-spacing:.04em}
.foot{margin:0;font-size:8px;color:var(--muted);text-align:center;line-height:2}
.foot a{color:var(--ink)}
@media (max-width:560px){.minis{display:grid;gap:6px}.right{gap:8px}.joy{display:none}.panel{gap:8px;padding:10px 12px}.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,38px)}.arc{width:62px;height:62px;font-size:9px}.mini{padding:6px 7px;font-size:7px}.help .keys{display:none}}
@container (max-width:500px){.joy{display:none}.panel{flex-wrap:nowrap}}
@container (max-width:460px){.minis{display:grid;gap:6px}.right{gap:8px}.joy{display:none}.panel{padding:10px 12px;gap:8px}}
@container (width < 320px){.dpad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,32px)}.arc{width:52px;height:52px;font-size:8px}.mini{padding:5px;font-size:7px}.right{gap:6px}}
@media (max-height:520px) and (orientation:landscape){.minis{display:flex;gap:8px}.marquee,.help,.foot{display:none}.room{padding-block:6px}.cabinet{grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 10px 12px;width:min(100%, 760px, max(300px, calc((100dvh - 162px) * 4 / 3 + 36px)))}.bezel{padding:8px}.joy{display:none}.panel{gap:8px;padding:6px 12px}.dpad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,28px)}.arc{width:50px;height:50px;font-size:8px}.mini{padding:6px 7px;font-size:7px}}
@media (prefers-reduced-motion: reduce){.crt{animation:none}}
.cabinet{--panelh:332px}
/* ---------- touch screens: the cabinet's joystick replaces the D-pad. Pull it; it springs back upright. ---------- */
.cabinet.touch .joy{display:flex}
/* upright (phones, iPads): the stick under the screen in place of the D-pad; the panel grows by the bigger stick, so the screen gives up that height */
@media (orientation:portrait){
  .cabinet.touch{--st:104px;--jx:29px;width:min(100%, 760px, max(300px, calc((85vh - var(--panelh) - var(--jx)) * 4 / 3 + 52px)))}
  @supports (height:100dvh){.cabinet.touch{width:min(100%, 760px, max(300px, calc((85dvh - var(--panelh) - var(--jx)) * 4 / 3 + 52px)))}}
  .cabinet.touch .panel{justify-content:space-between}
  .cabinet.touch .dpad{display:none}
}
@media (orientation:portrait) and (min-width:600px){.cabinet.touch{--st:116px;--jx:37px}}
/* sideways (phones, iPads): the joystick on a deck left of the screen, the buttons on a deck to its right, the screen as tall as the height allows */
@media (orientation:landscape){
  .cabinet.touch{width:calc(var(--sh) * 4 / 3 + var(--chrome) + var(--deckL) + var(--deckR));grid-template-columns:var(--deckL) auto var(--deckR);align-items:center}
  .cabinet.touch .marquee{grid-area:marquee}.cabinet.touch .help{grid-area:help}.cabinet.touch .bezel{grid-area:bezel}
  .cabinet.touch .screen{width:calc(var(--sh) * 4 / 3);height:var(--sh)}
  .cabinet.touch .panel{display:contents}
  .cabinet.touch .joy,.cabinet.touch .right{background:linear-gradient(180deg, #1f5585, #0e2a4d);border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12), inset 0 -6px 12px rgba(0,0,0,.35)}
  .cabinet.touch .joy{grid-area:joy;width:100%;padding-bottom:14px}
  .cabinet.touch .right{grid-area:right;width:100%;flex-direction:column;gap:10px;padding:12px 0}
  .cabinet.touch .acts{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cabinet.touch .minis{display:grid;gap:6px}
  .cabinet.touch .dpad{display:none}
}
@media (orientation:landscape) and (min-height:521px){
  .cabinet.touch{--st:116px;--deckL:156px;--deckR:104px;--chrome:76px;column-gap:12px;grid-template-areas:"marquee marquee marquee" "joy bezel right" "help help help";
    --sh:min(calc(100vh - 160px - clamp(64px, 15vh, 170px)), calc((100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px)) - var(--chrome) - var(--deckL) - var(--deckR)) * 3 / 4))}
  @supports (height:100dvh){.cabinet.touch{--sh:min(calc(100dvh - 160px - clamp(64px, 15vh, 170px)), calc((100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px)) - var(--chrome) - var(--deckL) - var(--deckR)) * 3 / 4))}}
}
@media (orientation:landscape) and (max-height:520px){
  .cabinet.touch{--st:104px;--deckL:136px;--deckR:86px;--chrome:52px;column-gap:8px;grid-template-areas:"joy bezel right";
    --sh:min(calc(100vh - 50px), calc((100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px)) - var(--chrome) - var(--deckL) - var(--deckR)) * 3 / 4))}
  @supports (height:100dvh){.cabinet.touch{--sh:min(calc(100dvh - 50px), calc((100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px)) - var(--chrome) - var(--deckL) - var(--deckR)) * 3 / 4))}}
  .cabinet.touch .minis{gap:4px}.cabinet.touch .mini{padding:4px 6px;line-height:1.25}
}
</style>

<script>
/* ---------- the pullable arcade joystick, shared by the Nellie arcade games ----------
   The cabinet's own joystick (a round socket, a silver shaft, a ball on top) is a real control: a finger or the mouse
   anywhere on it pulls it, the stick tilts toward the pull, and on release it springs back upright.
   The pull is measured from where the finger came down: full lock at `lock` px (about 56). Axes "x" (steering: left
   and right only) or "xy" (the maze: four ways). Values -1..1, a small dead zone at the centre. One pointer owns it,
   so other fingers stay free for other buttons. It never starts a game or changes a mode: the game decides what a pull means.
   Markup: <div class="joy hint" id="joy" ...><div class="stick" id="stick"><i></i></div><span class="joy-label">...</span></div>
   "hint" wiggles the stick (on touch screens) until the first touch. */
const NBDStick = (() => {
  const J = {};
  // touch screens get the joystick as their control: phones and iPads (an iPad can report itself as a Mac, so its touch points count too)
  J.isTouch = () => { try { return matchMedia("(any-pointer: coarse)").matches || navigator.maxTouchPoints > 1; } catch (e) { return false; } };
  // put the "touch" class on el now on a touch device; on anything else at its first touch
  J.watch = el => {
    if (!el) return;
    if (J.isTouch()) el.classList.add("touch");
    addEventListener("pointerdown", e => { if (e.pointerType === "touch") el.classList.add("touch"); }, true);
    try { const mq = matchMedia("(any-pointer: coarse)"); if (mq.addEventListener) mq.addEventListener("change", e => { if (e.matches) el.classList.add("touch"); }); } catch (e) {}
  };
  // o: { axes: "x" | "xy", dead: 0.1, lock: 56, tilt: 28, onDown(), onRelease(), onFlick(dx), onDir(d) }
  //   onFlick(dx): the stick pushed past half way left (-1) or right (1), once per push (for letter pickers)
  //   onDir(d):    "xy" only, the main direction of the pull changed to "left" / "right" / "up" / "down"
  J.make = (root, o = {}) => {
    const axes = o.axes || "x", dead = o.dead == null ? 0.1 : o.dead, lock = o.lock || 56, tilt = o.tilt || 28;
    const shaft = root.querySelector(".stick i"), slider = root.getAttribute("role") === "slider";
    const S = { x: 0, y: 0, rx: 0, ry: 0, id: null, x0: 0, y0: 0, zx: 0, dir: null, now: 0, spring: 0 };
    function paint() {
      if (!S.rx && !S.ry) { shaft.style.transform = ""; return; }
      let t = "rotate(" + (S.rx * tilt).toFixed(1) + "deg)";
      // pulled up the stick leans away (looks longer), pulled down it leans in (looks shorter), as the maze cabinet's own tilts
      if (S.ry < 0) t += " translateY(" + (S.ry * 3).toFixed(1) + "px) scaleY(" + (1 - S.ry * 0.12).toFixed(3) + ")";
      else if (S.ry > 0) t += " translateY(" + (S.ry * 4).toFixed(1) + "px) scaleY(" + (1 - S.ry * 0.18).toFixed(3) + ")";
      shaft.style.transform = t;
    }
    function set(rx, ry) {
      if (axes === "x") { ry = 0; rx = Math.max(-1, Math.min(1, rx)); }
      else { const m = Math.hypot(rx, ry); if (m > 1) { rx /= m; ry /= m; } }
      S.rx = rx; S.ry = ry;
      const m = Math.hypot(rx, ry); S.x = m < dead ? 0 : rx; S.y = m < dead ? 0 : ry;
      paint();
      if (slider) { const now = Math.round(S.x * 100); if (now !== S.now) { S.now = now; root.setAttribute("aria-valuenow", now); root.setAttribute("aria-valuetext", now === 0 ? "center" : (now < 0 ? "left " : "right ") + Math.abs(now) + " percent"); } }
      const zx = rx > 0.5 ? 1 : rx < -0.5 ? -1 : Math.abs(rx) < 0.3 ? 0 : S.zx;
      if (zx !== S.zx) { S.zx = zx; if (zx && S.id !== null && o.onFlick) o.onFlick(zx); }
      if (axes === "xy") {
        const ax = Math.abs(rx), ay = Math.abs(ry);
        let d = S.dir;
        if (Math.max(ax, ay) >= 0.35) d = ax >= ay ? (rx < 0 ? "left" : "right") : (ry < 0 ? "up" : "down");
        else if (m < 0.2) d = null;
        if (d !== S.dir) { S.dir = d; if (d && S.id !== null && o.onDir) o.onDir(d); }
      }
    }
    function release() {
      if (S.id === null && !S.rx && !S.ry) return;
      S.id = null; root.classList.remove("drag");
      root.classList.add("spring"); clearTimeout(S.spring); S.spring = setTimeout(() => root.classList.remove("spring"), 300);
      set(0, 0); if (o.onRelease) o.onRelease();
    }
    root.addEventListener("pointerdown", e => {
      if (S.id !== null || (e.pointerType === "mouse" && e.button !== 0)) return;
      e.preventDefault();
      S.id = e.pointerId; try { root.setPointerCapture(e.pointerId); } catch (_) {}
      root.classList.remove("hint", "spring"); root.classList.add("drag");
      S.x0 = e.clientX; S.y0 = e.clientY;
      if (o.onDown) o.onDown();
      set(0, 0);
    });
    root.addEventListener("pointermove", e => { if (e.pointerId !== S.id) return; e.preventDefault(); set((e.clientX - S.x0) / lock, (e.clientY - S.y0) / lock); });
    for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) root.addEventListener(t, e => { if (e.pointerId === S.id) release(); });
    for (const t of ["contextmenu", "selectstart", "dragstart"]) root.addEventListener(t, e => e.preventDefault());
    addEventListener("blur", release);
    document.addEventListener("visibilitychange", () => { if (document.hidden) release(); });
    return { get x() { return S.x; }, get y() { return S.y; }, get rawX() { return S.rx; }, get rawY() { return S.ry; }, get held() { return S.id !== null; },
      get hinting() { return root.classList.contains("hint"); }, release };
  };
  return J;
})();

NBDStick.watch(document.querySelector(".cabinet"));
</script>

<script>
/* ---------- 3D mode kit, shared by the Nellie arcade games ----------
   The cast are 3D models made from the show's cast sheet (Hunyuan 3D, packed to about 12,000 triangles each).
   three.js loads only when a player picks 3D, so the classic game stays as light as before. */
const K3 = (() => {

const SFX = {
  chomp() { const t = tn(); wakka ^= 1; tone(wakka ? 330 : 440, t, 0.07, "triangle", 0.3, wakka ? 220 : 520); },
  bone()  { const t = tn(); [523, 784, 1047].forEach((f, i) => tone(f, t + i * 0.05, 0.08, "square", 0.24)); },
  eat()   { const t = tn(); tone(200, t, 0.35, "square", 0.25, 1400); },
  treat() { const t = tn(); [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.05, 0.07, "square", 0.22)); },
  ting()  { const t = tn(); tone(1760, t, 0.9, "sine", 0.45); tone(2637, t, 0.5, "sine", 0.14); },
  ting2() { const t = tn(); [0, 0.2].forEach(d => { tone(1760, t + d, 0.7, "sine", 0.4); tone(2637, t + d, 0.4, "sine", 0.12); }); },
  die()   { const t = tn(); for (let i = 0; i < 10; i++) tone(880 - i * 70, t + i * 0.11, 0.12, "square", 0.22, 700 - i * 60); },
  intro() { const t = tn(); const m = [523, 1047, 784, 659, 1047, 784, 659, 0, 554, 1109, 831, 698, 1109, 831, 698]; m.forEach((f, i) => f && tone(f, t + i * 0.13, 0.12, "square", 0.2)); },
  clear() { const t = tn(); [784, 988, 1175, 1568].forEach((f, i) => tone(f, t + i * 0.09, 0.12, "square", 0.24)); },
  life()  { const t = tn(); [523, 784, 1047, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.06, 0.09, "square", 0.24)); },
  tick()  { tone(1200, tn(), 0.03, "square", 0.16); },
  pause() { const t = tn(); tone(660, t, 0.06, "square", 0.2); tone(440, t + 0.07, 0.08, "square", 0.2); },
};
function sirenSet(mode) { // the background hum of the house at night; it rises when the chasers are scared
  if (!ac || !sirenG) return; const t = ac.currentTime;
  if (!mode) { sirenG.gain.setTargetAtTime(0, t, 0.05); return; }
  sirenG.gain.setTargetAtTime(mode === "fright" ? 0.05 : 0.035, t, 0.05);
  const f = mode === "fright" ? 260 + 80 * Math.sin(t * 18) : 340 + 120 * Math.sin(t * 6);
  siren.frequency.setTargetAtTime(f, t, 0.02);
}

/* ---------- the maze ---------- */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: "down", down: "up", left: "right", right: "left" };
const ORDER = ["up", "left", "down", "right"];
let food = null, foodLeft = 0;
const tileAt = (c, r) => (r < 0 || r >= ROWS) ? "#" : MAZE[r][((c % COLS) + COLS) % COLS];
const openFor = (who, c, r) => { const t = tileAt(c, r); if (t === "#") return false; if (t === "-" || t === "G") return who !== "nellie"; return true; };
const cx = c => OX + c * TS + TS / 2, cy = r => OY + r * TS + TS / 2;
const mazeCanvas = document.createElement("canvas"); mazeCanvas.width = W; mazeCanvas.height = H;
function paintMaze(flash) {

  /* ---------- cameras: framed so that what matters lands where the 2D overlay expects it ---------- */
  // zoom and shift a camera (a tilt-shift lens) so the points fill the rectangle (in game pixels)
  function fitCam(c, pts, rect) {
    c.zoom = 1; c.clearViewOffset(); c.updateMatrixWorld(); c.updateProjectionMatrix();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of pts) { v.copy(p).project(c); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
    const tw = (rect[2] - rect[0]) / (W / 2), th = (rect[3] - rect[1]) / (H / 2);
    const k = Math.min(x1 - x0 > 1e-6 ? tw / (x1 - x0) : 1e9, y1 - y0 > 1e-6 ? th / (y1 - y0) : 1e9);
    const dx = (rect[0] + rect[2]) / W - 1 - (x0 + x1) / 2 * k, dy = 1 - (rect[1] + rect[3]) / H - (y0 + y1) / 2 * k;
    const w = glc.clientWidth || 640, h = glc.clientHeight || 480;
    c.zoom = k; c.setViewOffset(w, h, -dx * w / 2, dy * h / 2, w, h);
  }

  /* ---------- a frame of play ---------- */

      const x = wx(c.x), z = wz(c.y), inPen = Math.abs(z - tz(10)) < 1.55 && Math.abs(x - tx(15)) < 3.55;

    if (r.st === "clear") hop = Math.abs(Math.sin(r.stT * 7)) * 0.22;

  // title: Nellie turning gently where the pixel Nellie stood

  };

  // where a point of the house lands on screen, in game pixels (for the overlay: pops, READY, the Dog View ring)
  const scr = p => { p.project(cam); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; };
  o.tileAt = (c, r, h) => scr(v.set(tx(c), h || 0, tz(r)));
  o.ringAt = d => scr(v.set(wx(d.x), collarY(), wz(d.y - 6) + collarZ()));          // the ring starts at Nellie's collar
  o.popAt = p => scr(v.set(wx(p.x), 1.3 + (p.y0 - p.y) * 0.035, wz(p.y0 + 9)));
  // test builds only: a harness that sets window.__kibble3dDebug before 3D loads gets this view to measure and tune
  if (window.__kibble3dDebug === true) { o.tune = TUNE; o.nellieAt = h => { const n = run.nellie; return scr(v.set(wx(n.x), NH * (h === undefined ? 0.5 : h), wz(n.y) - LEAN * NH * (h === undefined ? 0.5 : h))); }; o.NH = () => NH; window.__kibble3dDebug = o; }
  return o;
}
